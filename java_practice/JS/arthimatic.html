<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<body>
   <script>
    var a=10;
    var b=2;
    document.write(a+b+ "<br>")
    document.write(a-b+"<br>")
    document.write(a*b+"<br>")
    document.write(a%b+"<br>")
    document.write(a**b+"<br>")
    document.write(a/b+"<br>")
    document.write(b%a+"<br>")
    document.write(++a+"<br>")
    document.write(--a+"<br>")
    document.write(--b+"<br>")
    
   </script> 
</body>
</html>
