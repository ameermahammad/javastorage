<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<body>
  <script>
    var a=4;
    var b=2;
    function mul(a,b)
    {
        document.write(a*b+"<br>")
    }
    mul(a,b)
    function div(a,b)
    {
        document.write(a/b+"<br>")
    }
    div(a,b)
    function add(a,b)
    {
        document.write(a+b+"<br>")
    }
    add(a,b)
    function mod(a,b)
    {
        document.write(a%b+"<br>")
    }
    mod(a,b)
    function pow(a,b)
    {
        document.write(a**b+"<br>")
    }
    pow(a,b)
  </script>  
</body>
</html>
