<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<body>
  <input type="password" placeholder="enter the password" id="pass"  oninput="password()">  
  <h1 id="status" style="color: rgba(235, 17, 17, 0.91);"></h1>
  <h1 id="status1" style="color: rgba(238, 255, 0, 0.919);"></h1>
  <h1 id="status2" style="color: green;"></h1>
  <script>
    function password()
    {
        var pass=document.getElementById("pass").value
        var passlength=pass.length
        if(passlength==0)
        {
            document.getElementById("status").innerHTML=" "
        }
        else if(passlength>=1 && passlength<=5)
        {
            document.getElementById("status").innerHTML="weak password"
        }
        else if(passlength>=6 && passlength<=10)
        {
            document.getElementById("status1").innerHTML="good password"
        }
        else 
        {
            document.getElementById("status2").innerHTML="strong password"
        }
    }
  </script>
</body>
</html>
